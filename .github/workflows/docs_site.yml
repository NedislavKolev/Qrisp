name: Documentation website

# Builds the documentation of every version listed in
# documentation/versions/versions.toml, one job per version, and assembles the
# website from the results. The website is uploaded as the artifact "docs-site";
# deploying it to qrisp.eu is not part of this workflow. See
# documentation/README.md.

on:
  push:
    branches:
      - main
      - Build-and-host-documentation-for-all-released-Qrisp-versions-+-development-version
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - Build-and-host-documentation-for-all-released-Qrisp-versions-+-development-version
    # The documentation of the checkout itself is already built for pull
    # requests by Read the Docs. Pull requests rebuild the website only when
    # they change how it is built.
    paths:
      - ".github/workflows/docs_site.yml"
      - "documentation/build_versions.py"
      - "documentation/versions/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Version of uv that build_versions.py uses to create the build environments
  UV_VERSION: "0.12.5"

jobs:
  versions:
    name: List the versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Read documentation/versions/versions.toml
        id: list
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, tomllib
          with open("documentation/versions/versions.toml", "rb") as file:
              print("versions=" + json.dumps(list(tomllib.load(file)["versions"])))
          EOF

  build:
    name: Build ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # A failing version does not stop the others, so that a run shows every
      # failure at once. The website is only assembled if all succeed.
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The releases are built from their git tags
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv and pandoc
        run: |
          python -m pip install "uv==${UV_VERSION}"
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build the documentation of ${{ matrix.version }}
        run: python documentation/build_versions.py build "$VERSION"

      - name: Upload the documentation of ${{ matrix.version }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-version-${{ matrix.version }}
          path: documentation/build/site/en/${{ matrix.version }}
          if-no-files-found: error
          # Only needed by the job below
          retention-days: 1

  site:
    name: Assemble the website
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the documentation of every version
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docs-version-*
          path: documentation/build/downloads

      - name: Assemble the website
        run: |
          mkdir -p documentation/build/site/en
          for directory in documentation/build/downloads/docs-version-*; do
            mv "$directory" "documentation/build/site/en/${directory##*/docs-version-}"
          done
          python documentation/build_versions.py assemble

      - name: Upload the website
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: documentation/build/site
          if-no-files-found: error
          retention-days: 14
